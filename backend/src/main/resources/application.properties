# =============================================================================
# Interline Booking Manager - configuración
#
# Quarkus usa UN solo archivo con prefijos de perfil (%dev., %test., %prod.)
# en lugar de application-dev.properties / application-test.properties de
# Spring Boot. El perfil activo: dev con `quarkus:dev`, test en @QuarkusTest y
# prod al ejecutar el jar o la imagen (equivale a spring.profiles.active).
# =============================================================================

quarkus.application.name=interline-booking-manager

# Valores por defecto para la observabilidad mientras no hay colector local
grafana.endpoint=http://localhost:3000
otel-collector.url=http://localhost:4317

# Sin exportación de trazas en modo dev por ahora
%dev.quarkus.otel.sdk.disabled=true

# --- OpenAPI (contract-first) ------------------------------------------------
# Se publica el contrato de /api/openapi.yaml (copiado a META-INF/openapi.yaml
# en el build) SIN mezclarlo con lo que se descubra escaneando anotaciones: el
# documento servido es exactamente el contrato revisado. Spring: springdoc con
# springdoc.api-docs.enabled + un spec estático.
mp.openapi.scan.disable=true
quarkus.smallrye-openapi.path=/openapi
# Swagger UI también en prod (portafolio); en un producto real se limitaría a dev.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.title=Interline Booking Manager API

# --- Base de datos ------------------------------------------------------------
# En dev y test no se configura URL: Dev Services arranca un PostgreSQL en Docker
# (como @ServiceConnection + Testcontainers en Spring Boot 3.1+, pero automático).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:17-alpine
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/interline}
%prod.quarkus.datasource.username=${DB_USER:interline}
%prod.quarkus.datasource.password=${DB_PASSWORD:}

# Flyway gestiona el esquema; Hibernate solo lo valida (≈ spring.jpa.hibernate.ddl-auto=validate)
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false
%dev.quarkus.hibernate-orm.log.sql=true

# --- Jackson ------------------------------------------------------------------
# Omite campos opcionales nulos (≈ spring.jackson.default-property-inclusion=non_null)
quarkus.jackson.serialization-inclusion=non_null

# --- Proveedores externos -----------------------------------------------------
# Adaptador que implementa FlightOffersProvider: simulated | amadeus-style (fase 3)
app.flight-offers.provider=simulated
# Inventario simulado: IB responde UC y confirma en la primera consulta de la saga
app.simulated.inventory.unconfirmed-carriers=IB
app.simulated.inventory.confirm-after-checks=1

# --- Saga de emisión ------------------------------------------------------------
app.saga.segment-confirmation.max-attempts=3
app.saga.segment-confirmation.initial-delay=PT0.5S
app.saga.segment-confirmation.backoff-multiplier=2.0
%test.app.saga.segment-confirmation.initial-delay=PT0.01S

# --- Seguridad (OIDC) ----------------------------------------------------------
# Preparado para un IdP OIDC (Keycloak, Google Identity Platform, Auth0...). Desactivado
# en dev y test; en prod se activa con OIDC_ENABLED=true y OIDC_AUTH_SERVER_URL.
# Spring Boot: spring.security.oauth2.resourceserver.jwt.issuer-uri.
quarkus.oidc.tenant-enabled=${OIDC_ENABLED:false}
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:https://idp.invalid/realms/interline}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:interline-api}
quarkus.oidc.application-type=service
quarkus.keycloak.devservices.enabled=false
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.auth.permission.api.enabled=${OIDC_ENABLED:false}
%dev.quarkus.oidc.tenant-enabled=false
%dev.quarkus.http.auth.permission.api.enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.http.auth.permission.api.enabled=false

# --- Observabilidad -------------------------------------------------------------
# Logs JSON en prod (Cloud Logging los indexa); texto legible en dev y test.
quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) [cid=%X{correlationId}] %s%e%n
quarkus.log.category."com.insightdevelop".level=INFO
quarkus.otel.exporter.otlp.endpoint=${otel-collector.url}
%test.quarkus.otel.sdk.disabled=true
