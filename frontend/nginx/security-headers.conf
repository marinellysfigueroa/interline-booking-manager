# Cabeceras de seguridad. Se incluyen en cada location porque un add_header dentro de una
# location anula los heredados del server.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Angular inyecta los estilos de componentes como <style>: hace falta 'unsafe-inline' en style-src.
# Los scripts son todos de 'self' (inlineCritical desactivado en angular.json).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
