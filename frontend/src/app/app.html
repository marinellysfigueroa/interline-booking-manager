<a class="skip-link" href="#main">Saltar al contenido</a>
<header class="topbar">
  <div class="brand">
    <img [src]="theme.theme().logo" alt="" width="40" height="40" />
    <div>
      <strong>{{ theme.theme().name }}</strong>
      <small>{{ theme.theme().tagline }}</small>
    </div>
  </div>
  <nav aria-label="Principal">
    <a routerLink="/booking" routerLinkActive="active">Reservar</a>
    <a routerLink="/manage" routerLinkActive="active">Mis reservas</a>
  </nav>
  <label class="tenant">
    <span class="visually-hidden">Aerolínea</span>
    <select (change)="onTenantChange($event)" aria-label="Aerolínea (white-label)">
      @for (t of theme.themes(); track t.tenant) {
        <!-- [selected] por opción: un [value] en el select se aplicaría antes de crear las opciones -->
        <option [value]="t.tenant" [selected]="t.tenant === theme.tenant()">
          {{ t.name }} ({{ t.tenant }})
        </option>
      }
    </select>
  </label>
</header>
<main id="main">
  <router-outlet />
</main>
<footer class="muted">Demo de portafolio · marcas ficticias · un solo ticket interline</footer>
<app-toasts />
