# =============================================================================
# Infraestructura (stack infra/terraform/app).
#
#   pull_request: terraform plan con una cuenta de SOLO LECTURA → resumen en el job
#   push a main:  terraform apply con la cuenta gh-terraform, tras aprobación del entorno
#                 "infrastructure" (Settings → Environments → required reviewers)
#
# El state vive en GCS (bucket del stack bootstrap) y no contiene secretos: la contraseña de la
# base de datos se genera como valor efímero y se escribe con argumentos write-only.
# =============================================================================
name: Infra

on:
  pull_request:
    paths:
      - infra/terraform/**
      - .github/workflows/infra.yml
  push:
    branches: [main]
    paths:
      - infra/terraform/**
      - .github/workflows/infra.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-app # nunca dos planes/applies a la vez sobre el mismo state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION }}
  TF_VAR_environment: ${{ vars.GCP_ENVIRONMENT || 'prod' }}
  TF_VAR_deployer_service_account: ${{ vars.GCP_DEPLOYER_SA }}
  WORKDIR: infra/terraform/app

jobs:
  plan:
    name: terraform plan
    # Los PR desde forks no reciben token OIDC: el plan solo corre para ramas del repositorio, y
    # solo cuando el stack bootstrap ya está aplicado (variables del repositorio definidas).
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_PLAN_SA }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: init
        run: terraform -chdir="$WORKDIR" init -backend-config="bucket=${{ vars.GCP_TF_STATE_BUCKET }}" -backend-config="prefix=interline/app"
      - name: plan
        run: |
          terraform -chdir="$WORKDIR" plan -no-color -lock-timeout=5m -out=tfplan
          {
            echo '### terraform plan'
            echo '```'
            terraform -chdir="$WORKDIR" show -no-color tfplan | tail -n 80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: terraform apply
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-24.04
    environment: infrastructure
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: init
        run: terraform -chdir="$WORKDIR" init -backend-config="bucket=${{ vars.GCP_TF_STATE_BUCKET }}" -backend-config="prefix=interline/app"
      - name: plan
        run: terraform -chdir="$WORKDIR" plan -no-color -lock-timeout=5m -out=tfplan
      - name: apply
        run: terraform -chdir="$WORKDIR" apply -no-color -lock-timeout=5m tfplan
